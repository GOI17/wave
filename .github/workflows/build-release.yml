name: Build & Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - os: Darwin
            arch: arm64
            runner: macos-latest
            ext: ""
          - os: Darwin
            arch: amd64
            runner: macos-15-intel
            ext: ""
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.23'
      
      - name: Tidy Dependencies
        run: go mod tidy
      
      - name: Build Binary
        env:
          GOOS: darwin
          GOARCH: ${{ matrix.arch }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [[ "$GITHUB_REF_TYPE" != "tag" ]]; then VERSION="beta"; fi
          go build -ldflags="-s -w -X wave/ui/cli.Version=${VERSION}" -o wave-${{ matrix.os }}-${{ matrix.arch }}${{ matrix.ext }} ./cmd/wave
          file wave-${{ matrix.os }}-${{ matrix.arch }}${{ matrix.ext }}
      
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: wave-${{ matrix.os }}-${{ matrix.arch }}
          path: wave-${{ matrix.os }}-${{ matrix.arch }}${{ matrix.ext }}
          retention-days: 5

  publish-stable:
    name: Publish Stable Release
    runs-on: ubuntu-latest
    needs: [build, test, sandbox]
    if: startsWith(github.ref, 'refs/tags/v')
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts
      
      - name: Create Release Notes
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          echo "# Wave $VERSION (Stable Release)" > RELEASE_BODY.md
          echo "" >> RELEASE_BODY.md
          echo "## Download" >> RELEASE_BODY.md
          echo "" >> RELEASE_BODY.md
          echo "Available builds:" >> RELEASE_BODY.md
          echo "- **macOS ARM64 (Apple Silicon)**: \`wave-Darwin-arm64\`" >> RELEASE_BODY.md
          echo "- **macOS Intel (x86_64)**: \`wave-Darwin-amd64\`" >> RELEASE_BODY.md
          echo "" >> RELEASE_BODY.md
          echo "## What's New" >> RELEASE_BODY.md
          echo "" >> RELEASE_BODY.md
          awk '/^---$/ { exit } { print }' RELEASE_NOTES.md >> RELEASE_BODY.md
          echo "" >> RELEASE_BODY.md
          echo "## Installation" >> RELEASE_BODY.md
          echo "" >> RELEASE_BODY.md
          echo "\`\`\`bash" >> RELEASE_BODY.md
          echo "# Download the appropriate binary for your Mac" >> RELEASE_BODY.md
          echo "wget https://github.com/${{ github.repository }}/releases/download/${VERSION}/wave-Darwin-arm64" >> RELEASE_BODY.md
          echo "chmod +x wave-Darwin-arm64" >> RELEASE_BODY.md
          echo "./wave-Darwin-arm64 --version" >> RELEASE_BODY.md
          echo "\`\`\`" >> RELEASE_BODY.md
      
      - name: Prepare Artifacts for Release
        run: |
          mkdir -p release
          for dir in artifacts/*/; do
            if [ -f "$dir/wave-Darwin-"* ]; then
              cp "$dir"/wave-Darwin-* release/
            fi
          done
          cd release
          sha256sum wave-Darwin-* > SHA256SUMS
          cd ..
          ls -lah release/
      
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            release/wave-Darwin-*
            release/SHA256SUMS
          body_path: RELEASE_BODY.md
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-beta:
    name: Publish Beta Release
    runs-on: ubuntu-latest
    needs: [build, test, sandbox]
    if: github.ref == 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/')
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts
      
      - name: Prepare Artifacts for Release
        run: |
          mkdir -p release
          for dir in artifacts/*/; do
            if [ -f "$dir/wave-Darwin-"* ]; then
              cp "$dir"/wave-Darwin-* release/
            fi
          done
          cd release
          sha256sum wave-Darwin-* > SHA256SUMS
          cd ..
          ls -lah release/
      
      - name: Create or Update Beta Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            release/wave-Darwin-*
            release/SHA256SUMS
          tag_name: beta
          name: Beta Build
          body: |
            # Wave Beta Build
            
            This is the latest beta build from the `main` branch.
            
            **Download:**
            - macOS ARM64 (Apple Silicon): `wave-Darwin-arm64`
            - macOS Intel (x86_64): `wave-Darwin-amd64`
            
            **Note:** Beta builds may be unstable. For production use, download the latest stable release.
          draft: false
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  test:
    name: Run Tests
    runs-on: macos-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.23'
      
      - name: Tidy Dependencies
        run: go mod tidy
      
      - name: Run Tests
        run: go test -race -count=1 ./...
      
      - name: Vet
        run: go vet ./...

  # The application requires macOS syscalls; Linux is only a test sandbox.
  sandbox:
    name: Run Portable Sandbox Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: make test-sandbox
