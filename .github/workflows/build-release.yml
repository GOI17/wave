name: Build & Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  build:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - os: Darwin
            arch: arm64
            runner: macos-latest
            ext: ""
          - os: Darwin
            arch: amd64
            runner: macos-13
            ext: ""
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.23'
      
      - name: Build Binary
        env:
          GOOS: darwin
          GOARCH: ${{ matrix.arch }}
        run: |
          go build -o wave-${{ matrix.os }}-${{ matrix.arch }}${{ matrix.ext }} ./cmd/wave
          file wave-${{ matrix.os }}-${{ matrix.arch }}${{ matrix.ext }}
      
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: wave-${{ matrix.os }}-${{ matrix.arch }}
          path: wave-${{ matrix.os }}-${{ matrix.arch }}${{ matrix.ext }}
          retention-days: 5

  publish-stable:
    name: Publish Stable Release
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts
      
      - name: Create Release Notes
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          echo "# Wave $VERSION (Stable Release)" > RELEASE_BODY.md
          echo "" >> RELEASE_BODY.md
          echo "## Download" >> RELEASE_BODY.md
          echo "" >> RELEASE_BODY.md
          echo "Available builds:" >> RELEASE_BODY.md
          echo "- **macOS ARM64 (Apple Silicon)**: \`wave-Darwin-arm64\`" >> RELEASE_BODY.md
          echo "- **macOS Intel (x86_64)**: \`wave-Darwin-amd64\`" >> RELEASE_BODY.md
          echo "" >> RELEASE_BODY.md
          echo "## What's New" >> RELEASE_BODY.md
          echo "" >> RELEASE_BODY.md
          echo "See [Release Notes](./RELEASE_NOTES.md) for details." >> RELEASE_BODY.md
          echo "" >> RELEASE_BODY.md
          echo "## Installation" >> RELEASE_BODY.md
          echo "" >> RELEASE_BODY.md
          echo "\`\`\`bash" >> RELEASE_BODY.md
          echo "# Download the appropriate binary for your Mac" >> RELEASE_BODY.md
          echo "wget https://github.com/${{ github.repository }}/releases/download/${VERSION}/wave-Darwin-arm64" >> RELEASE_BODY.md
          echo "chmod +x wave-Darwin-arm64" >> RELEASE_BODY.md
          echo "./wave-Darwin-arm64 --version" >> RELEASE_BODY.md
          echo "\`\`\`" >> RELEASE_BODY.md
      
      - name: Prepare Artifacts for Release
        run: |
          mkdir -p release
          for dir in artifacts/*/; do
            if [ -f "$dir/wave-Darwin-"* ]; then
              cp "$dir"/wave-Darwin-* release/
            fi
          done
          ls -lah release/
      
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: release/wave-Darwin-*
          body_path: RELEASE_BODY.md
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-beta:
    name: Publish Beta Release
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/')
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts
      
      - name: Prepare Artifacts for Release
        run: |
          mkdir -p release
          for dir in artifacts/*/; do
            if [ -f "$dir/wave-Darwin-"* ]; then
              cp "$dir"/wave-Darwin-* release/
            fi
          done
          ls -lah release/
      
      - name: Create or Update Beta Release
        uses: softprops/action-gh-release@v1
        with:
          files: release/wave-Darwin-*
          tag_name: beta
          name: Beta Build
          body: |
            # Wave Beta Build
            
            This is the latest beta build from the `main` branch.
            
            **Download:**
            - macOS ARM64 (Apple Silicon): `wave-Darwin-arm64`
            - macOS Intel (x86_64): `wave-Darwin-amd64`
            
            **Note:** Beta builds may be unstable. For production use, download the latest stable release.
          draft: false
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  test:
    name: Run Tests
    runs-on: macos-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.23'
      
      - name: Run Tests
        run: make test
      
      - name: Run Linter
        run: make lint || true

  publish-docker:
    name: Publish Docker Image
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main'
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Determine Tags
        id: tags
        run: |
          REPO=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          if [[ $GITHUB_REF == refs/tags/v* ]]; then
            VERSION=${GITHUB_REF#refs/tags/}
            echo "tags=ghcr.io/${REPO}:${VERSION},ghcr.io/${REPO}:latest" >> $GITHUB_OUTPUT
          else
            echo "tags=ghcr.io/${REPO}:beta" >> $GITHUB_OUTPUT
          fi
      
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
